# seagrass-monitoring.yaml -- MarineGEO table metadata (Seagrass Monitoring)
#
# Authoring format. The flat registry tables the QC engine consumes are
# derived from this file; see R/convert-table-metadata-to-yaml.R.
#
# Quote any value YAML 1.1 would otherwise read as a number or a boolean:
# column names like "137.5", vocabulary values like "0.1" or "TRUE",
# and comparison operators like ">=".

schema_version: 1
protocol: Seagrass Monitoring
tables:
- table_id: seagrass-cover-monitoring-v1
  columns:
  - name: sample_event_id
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: partner_code
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: site_code
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: site_name
    type: STRING
    na_values: fail
  - name: transect
    type: TINYINT
    na_values: fail
    uuid_identity: true
  - name: quadrat
    type: INT
    na_values: fail
    uuid_identity: true
    numeric_range:
      range_type: inclusive
      min_fail: 0
      max_warn: 50
      min_warn: 0
  - name: sample_collection_date
    type: DATE
    na_values: fail
    uuid_identity: true
  - name: scientific_name
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: cover_method
    type: STRING
    na_values: warn
    one_of:
    - Braun-Blanquet
    - point count
    - percent bins
    - photoquadrats
    - visual estimation
    - method in notes
  - name: point_count
    type: INT
    na_values: allow
    numeric_range:
      range_type: inclusive
      min_fail: 0
      max_warn: 81
  - name: points_in_quadrat
    type: INT
    na_values: allow
    numeric_range:
      range_type: inclusive
      max_warn: 144
  - name: cover_code
    type: DOUBLE
    na_values: warn
    one_of:
    - '0'
    - '0.1'
    - '0.5'
    - '1'
    - '2'
    - '3'
    - '4'
  - name: percent_cover
    type: DOUBLE
    na_values: warn
    numeric_range:
      range_type: inclusive
      max_fail: 200
      min_fail: 0
      max_warn: 100
  - name: sediment_type
    type: STRING
    na_values: allow
  - name: cover_quadrat_dimensions
    type: STRING
    na_values: warn
    one_of:
    - 50x50cm
    - 100x100cm
    - 150x150cm
  - name: cover_sample_notes
    type: STRING
    na_values: allow
  - name: table_id
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: row_uuid
    type: STRING
    na_values: fail
  - name: input_filename
    type: STRING
    na_values: fail
  checks:
    aggregate:
    - rule_id: seagrass_cover_point_total
      group_by:
      - sample_event_id
      - transect
      - quadrat
      value: point_count
      function: sum
      comparison: ==
      target_column: points_in_quadrat
      severity: fail
      description: Point counts in a quadrat must sum to points_in_quadrat
    - rule_id: seagrass_cover_percent_total
      group_by:
      - sample_event_id
      - transect
      - quadrat
      value: percent_cover
      function: sum
      comparison: <=
      target_value: 100
      tolerance: 0.5
      severity: warn
      description: Percent cover within a quadrat should not exceed 100
    cross_table:
    - rule_id: cover_quadrat_has_shoot_count
      relation: subset
      right_table: shoot-count-monitoring-v1
      group_by:
      - sample_event_id
      - transect
      'on':
      - left: quadrat
        right: quadrat
      severity: warn
      description: Every quadrat with cover data should also have a shoot count
