  - name: partner_code
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: site_code
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: site_name
    type: STRING
    na_values: fail
  - name: transect
    type: TINYINT
    na_values: fail
    uuid_identity: true
  - name: quadrat
    type: INT
    na_values: fail
    uuid_identity: true
    numeric_range:
      range_type: ~
  - name: sample_collection_date
    type: DATE
    na_values: fail
    uuid_identity: true
  - name: scientific_name
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: leaf_rank
    type: INT
    na_values: warn
    uuid_identity: true
    numeric_range:
      range_type: ~
  - name: leaf_length_mm
    type: DOUBLE
    na_values: warn
    numeric_range:
    - range_type: exclusive
      min_fail: 0
    - range_type: inclusive
      max_warn: 1200
      min_warn: 20
      when:
        label: zostera_leaves
        description: Leaf of a Zostera species
        all:
        - column: scientific_name
          taxon_within: Genus:Zostera
  - name: leaf_width_mm
    type: DOUBLE
    na_values: warn
    numeric_range:
      range_type: exclusive
      min_fail: 0
  - name: leaf_measurement_notes
    type: STRING
    na_values: allow
  - name: table_id
    type: STRING
    na_values: fail
    uuid_identity: true
  - name: row_uuid
    type: STRING
    na_values: fail
  - name: input_filename
    type: STRING
    na_values: fail
  checks:
    cross_table:
    - rule_id: leaf_quadrat_in_cover
      relation: subset
      right_table: seagrass-cover-monitoring-v1
      group_by:
      - sample_event_id
      - transect
      'on':
      - left: quadrat
        right: quadrat
      severity: fail
      description: Every quadrat with leaf measurements must appear in the cover table
