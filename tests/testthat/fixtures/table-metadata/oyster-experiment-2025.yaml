    type: DOUBLE
  - name: chain_distance_cm
    type: DOUBLE
  - name: rugosity
    type: DOUBLE
  - name: cluster_height_cm
    type: DOUBLE
  - name: notes
    type: STRING
  - name: input_filename
    type: STRING
